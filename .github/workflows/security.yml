# 密钥泄露扫描：push / PR 即时拦截，每周一全历史复扫（新规则可能命中旧提交）。
# release.yml 通过 workflow_call 复用本工作流，打 tag 发布前再扫一次。
#
# 直接用 gitleaks CLI 而不是 gitleaks-action：action 在 tag push 事件下可能因
# commits 为空而跳过扫描；CLI 每次都对完整历史执行 `gitleaks git`，行为确定。
name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '23 3 * * 1'   # 每周一 03:23 UTC
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  frontend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 安装前端依赖
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: pnpm audit（high/critical）
        working-directory: web
        run: pnpm audit --prod --audit-level=high --json > "$RUNNER_TEMP/pnpm-audit.json" || true
      - name: 检查 audit 例外
        run: python tools/check_pnpm_audit.py --audit "$RUNNER_TEMP/pnpm-audit.json" --exceptions .github/audit-exceptions.json

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0       # 必须全历史：只扫工作区会放过已删除提交里的凭证

      - name: gitleaks 全历史扫描
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          "$HOME/.local/bin/gitleaks" git --config .gitleaks.toml --redact --exit-code 1 -v .
